# Exported from Render on 2026-07-09T17:50:19Z
version: "1"
services:
- type: web
  name: fitcloud-frontend
  runtime: static
  repo: https://github.com/HyeG18/fitcloud-tracker
  branch: develop
  envVars:
  - key: VITE_API_BASE_URL
    sync: false
  - key: NODE_VERSION
    sync: false
  buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
  staticPublishPath: dist
  routes:
  - type: rewrite
    source: /*
    destination: /index.html
  autoDeployTrigger: commit
  rootDir: frontend
- type: web
  name: fitcloud-tracker
  runtime: docker
  repo: https://github.com/HyeG18/fitcloud-tracker
  branch: develop
  plan: free
  envVars:
  - key: SERVER_PORT
    sync: false
  - key: SPRING_JPA_HIBERNATE_DDL_AUTO
    sync: false
  - key: SPRING_JPA_DATABASE_PLATFORM
    sync: false
  - key: SPRING_DATASOURCE_PASSWORD
    fromDatabase:
      name: fitcloud-db
      property: password
  - key: SPRING_DATASOURCE_USERNAME
    sync: false
  - key: SPRING_DATASOURCE_URL
    sync: false
  region: oregon
  dockerContext: .
  dockerfilePath: ./Dockerfile
  autoDeployTrigger: commit
  rootDir: backend
databases:
- name: fitcloud-db
  databaseName: fitcloud_db
  user: fitcloud_user
  plan: free
  region: oregon
  ipAllowList:
  - source: 0.0.0.0/0
    description: everywhere
  postgresMajorVersion: "16"
