services:
  fitcloud-db:
    image: postgres:16-alpine
    container_name: fitcloud-postgres
    environment:
      POSTGRES_DB: fitcloud_db
      POSTGRES_USER: fitcloud_user
      POSTGRES_PASSWORD: fitcloud_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fitcloud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcloud_user -d fitcloud_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  fitcloud-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitcloud-backend-app
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fitcloud-db:5432/fitcloud_db
      SPRING_DATASOURCE_USERNAME: fitcloud_user
      SPRING_DATASOURCE_PASSWORD: fitcloud_password
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      fitcloud-db:
        condition: service_healthy
    networks:
      - fitcloud-network

  fitcloud-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: fitcloud-frontend-app
    ports:
      - "3000:80"
    depends_on:
      - fitcloud-backend
    networks:
      - fitcloud-network

volumes:
  postgres_data:

networks:
  fitcloud-network:
    driver: bridge